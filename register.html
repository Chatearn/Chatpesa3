<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register | ChatPesa</title>

  <meta name="description" content="Create your ChatPesa account and connect with people around the world.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #061f16, #0b6b4f);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
      color: #17251f;
    }

    .container {
      width: 100%;
      max-width: 470px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo span {
      font-size: 32px;
      font-weight: 800;
      color: #0a8f68;
      letter-spacing: -1px;
    }

    .logo small {
      display: block;
      margin-top: 4px;
      color: #777;
      font-size: 13px;
    }

    .title {
      text-align: center;
      margin-top: 22px;
      margin-bottom: 7px;
      font-size: 25px;
      font-weight: 750;
      color: #17251f;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #34423c;
    }

    .input-box {
      position: relative;
    }

    .input-box span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      color: #0a8f68;
    }

    input,
    select {
      width: 100%;
      height: 51px;
      border: 1px solid #dce5e1;
      border-radius: 12px;
      padding: 0 14px 0 43px;
      outline: none;
      font-size: 15px;
      background: #f9fbfa;
      color: #222;
      transition: 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: #0a9b70;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(10, 155, 112, 0.10);
    }

    .password-note {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 0;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      padding: 0;
      flex-shrink: 0;
      accent-color: #0a8f68;
    }

    .terms a {
      color: #0a8f68;
      text-decoration: none;
      font-weight: 700;
    }

    .continue-btn {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #0a9b70, #087653);
      color: white;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(8, 118, 83, 0.25);
      transition: 0.2s ease;
    }

    .continue-btn:hover {
      transform: translateY(-1px);
    }

    .continue-btn:active {
      transform: translateY(1px);
    }

    .secure {
      text-align: center;
      margin-top: 18px;
      color: #888;
      font-size: 11px;
    }

    .secure strong {
      color: #0a8f68;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 17px;
      color: #0a8f68;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      .card {
        padding: 27px 20px;
        border-radius: 20px;
      }

      .title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        <span>ChatPesa</span>
        <small>Connect. Chat. Earn.</small>
      </div>

      <h1 class="title">Create Your Account</h1>

      <p class="subtitle">
        Enter your details below to create your ChatPesa account.
      </p>

      <form id="registrationForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>

          <div class="input-box">
            <span>👤</span>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>

          <div class="input-box">
            <span>📱</span>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="e.g. 0712 345 678"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <div class="input-box">
            <span>✉️</span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="country">Country</label>

          <div class="input-box">
            <span>🌍</span>

            <select id="country" name="country" required>
              <option value="">Select your country</option>
              <option value="Kenya">Kenya</option>
              <option value="Uganda">Uganda</option>
              <option value="Tanzania">Tanzania</option>
              <option value="Rwanda">Rwanda</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>

          <div class="input-box">
            <span>🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              minlength="6"
              required
            >
          </div>

          <div class="password-note">
            Password must contain at least 6 characters.
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="input-box">
            <span>🔐</span>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            >
          </div>
        </div>

        <div class="terms">
          <input type="checkbox" id="terms" required>

          <label for="terms">
            I agree to the ChatPesa
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>.
          </label>
        </div>

        <button type="submit" class="continue-btn">
          Continue to Payment →
        </button>

      </form>

      <div class="secure">
        🔒 <strong>Your information is kept secure.</strong>
      </div>

      <a href="index.html" class="back">
        ← Back to Home
      </a>

    </div>

  </div>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match. Please try again.");
        return;
      }

      /*
        Registration details are temporarily saved.
        Later, we can connect this to your backend/database.
      */

      const registrationData = {
        fullName: document.getElementById("fullName").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        country: document.getElementById("country").value
      };

      localStorage.setItem(
        "chatpesaRegistration",
        JSON.stringify(registrationData)
      );

      // Go to your existing payment page
      window.location.href = "payment.html";
    });
  </script>

</body>
</html>
