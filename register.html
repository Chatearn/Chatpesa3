<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | ChatPesa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: #f5f8f6;
    color: #18221d;
}

/* HEADER */
.header {
    height: 68px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #e8eee9;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #0a8f55;
}

.logo span {
    color: #18221d;
}

.home-link {
    text-decoration: none;
    color: #0a8f55;
    font-size: 14px;
    font-weight: 700;
}

/* MAIN */
.main {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 30px 18px 45px;
}

/* PROGRESS */
.progress {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
}

.step {
    display: flex;
    align-items: center;
}

.circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
}

.active {
    background: #0a8f55;
    color: #ffffff;
}

.next {
    background: #e2e9e4;
    color: #728078;
}

.line {
    width: 70px;
    height: 2px;
    background: #dce5df;
}

/* CARD */
.card {
    background: #ffffff;
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.07);
}

.heading {
    text-align: center;
    margin-bottom: 7px;
}

.heading h1 {
    font-size: 27px;
    color: #17231c;
}

.heading p {
    margin-top: 8px;
    font-size: 14px;
    color: #78837d;
    line-height: 1.5;
}

/* FORM */
.form-group {
    margin-top: 19px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 50px;
    border: 1px solid #dbe4de;
    border-radius: 11px;
    padding: 0 14px;
    font-size: 15px;
    outline: none;
    background: #fbfcfb;
}

input:focus {
    border-color: #0a8f55;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(10,143,85,0.08);
}

/* PHONE */
.phone {
    display: flex;
    gap: 9px;
}

.code {
    width: 90px;
    height: 50px;
    border: 1px solid #dbe4de;
    border-radius: 11px;
    background: #fbfcfb;
    padding: 0 8px;
    font-size: 14px;
}

.phone input {
    flex: 1;
}

/* BUTTON */
.continue {
    width: 100%;
    height: 53px;
    border: none;
    border-radius: 12px;
    margin-top: 25px;
    background: #0a8f55;
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

.continue:hover {
    background: #087a49;
}

/* FOOTER */
.note {
    text-align: center;
    margin-top: 17px;
    font-size: 12px;
    line-height: 1.5;
    color: #8a948e;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 11px;
    border-radius: 9px;
    background: #fff0f0;
    color: #c62828;
    font-size: 13px;
}

/* MOBILE */
@media (max-width: 480px) {
    .main {
        padding-top: 22px;
    }

    .card {
        padding: 25px 18px;
    }

    .heading h1 {
        font-size: 24px;
    }

    .line {
        width: 55px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">Chat<span>Pesa</span></div>
    <a href="index.html" class="home-link">Home</a>
</header>

<main class="main">

    <!-- PROGRESS -->
    <div class="progress">

        <div class="step">
            <div class="circle active">1</div>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle next">2</div>
        </div>

    </div>

    <!-- REGISTRATION CARD -->
    <div class="card">

        <div class="heading">
            <h1>Create your account</h1>
            <p>
                Enter your details below to get started with ChatPesa.
            </p>
        </div>

        <div id="error" class="error"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>

                <div class="phone">
                    <select class="code" id="countryCode">
                        <option value="+254">+254</option>
                        <option value="+44">+44</option>
                        <option value="+1">+1</option>
                    </select>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="712345678"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="continue">
                Continue to Payment →
            </button>

        </form>

        <p class="note">
            Your information is used to create your ChatPesa account.
        </p>

    </div>

</main>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const error = document.getElementById("error");

    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone =
        document.getElementById("countryCode").value +
        document.getElementById("phone").value.trim();

    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    error.style.display = "none";

    if (password.length < 6) {
        error.textContent = "Password must be at least 6 characters.";
        error.style.display = "block";
        return;
    }

    if (password !== confirmPassword) {
        error.textContent = "Passwords do not match.";
        error.style.display = "block";
        return;
    }

    /* Save registration details for the next page */
    localStorage.setItem("chatpesaRegistration", JSON.stringify({
        fullName: fullName,
        username: username,
        email: email,
        phone: phone
    }));

    /* Go to the separate payment page */
    window.location.href = "payment.html";
});
</script>

</body>
</html>
