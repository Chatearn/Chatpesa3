<title>Register | ChatPesa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --purple:#6d28d9;
    --violet:#8b5cf6;
    --dark:#3b0764;
    --deep:#180629;
    --light:#f3eaff;
    --text:#24152f;
    --muted:#7b7085;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(circle at 10% 10%,rgba(139,92,246,.25),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(109,40,217,.20),transparent 30%),
        linear-gradient(135deg,#f8f4fc,#eee7f7);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px 15px;
    color:var(--text);
}

/* MAIN */

.wrapper{
    width:100%;
    max-width:1000px;

    display:grid;
    grid-template-columns: .85fr 1.15fr;

    background:white;

    border-radius:30px;

    overflow:hidden;

    box-shadow:
        0 35px 90px rgba(45,20,70,.18);

    position:relative;
    z-index:2;
}

/* LEFT SIDE */

.brand-panel{
    padding:50px 38px;

    color:white;

    background:
        radial-gradient(circle at 90% 10%,rgba(255,255,255,.16),transparent 30%),
        radial-gradient(circle at 10% 90%,rgba(168,85,247,.18),transparent 30%),
        linear-gradient(145deg,#180629,#4c1d95,#7c3aed);

    display:flex;
    flex-direction:column;
    justify-content:center;

    position:relative;
    overflow:hidden;
}

.brand-panel::after{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.10);

    right:-100px;
    bottom:-90px;
}

.brand-logo{
    font-size:32px;
    font-weight:950;
    letter-spacing:-2px;

    margin-bottom:8px;
}

.brand-tagline{
    color:#ddd0ed;
    font-size:13px;
    margin-bottom:55px;
}
