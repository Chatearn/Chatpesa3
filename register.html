<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | ChatPesa</title>
<meta name="description" content="Create your ChatPesa account and connect with people worldwide.">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #f4fff9, #ffffff);
    min-height: 100vh;
    color: #17201b;
}

.header {
    background: #0b8f55;
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo span {
    color: #d9ffea;
}

.back-btn {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: 35px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.title {
    text-align: center;
    margin-bottom: 8px;
    font-size: 28px;
    color: #087c49;
}

.subtitle {
    text-align: center;
    color: #68736d;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 700;
    color: #26332c;
}

input,
select {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #d8e1dc;
    border-radius: 12px;
    background: #fafcfb;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

input:focus,
select:focus {
    border-color: #0b8f55;
    background: white;
    box-shadow: 0 0 0 3px rgba(11,143,85,0.10);
}

.phone-row {
    display: flex;
    gap: 8px;
}

.country-code {
    width: 92px;
}

.phone-number {
    flex: 1;
}

.fee-box {
    background: #effaf4;
    border: 1px solid #c9eedb;
    border-radius: 14px;
    padding: 15px;
    margin: 22px 0;
    text-align: center;
}

.fee-label {
    font-size: 13px;
    color: #627068;
    margin-bottom: 4px;
}

.fee {
    color: #087c49;
    font-size: 25px;
    font-weight: 800;
}

.continue-btn {
    width: 100%;
    border: none;
    background: #0b8f55;
    color: white;
    padding: 15px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
}

.continue-btn:hover {
    background: #087947;
}

.continue-btn:active {
    transform: scale(0.98);
}

.terms {
    text-align: center;
    font-size: 12px;
    color: #7a847f;
    line-height: 1.5;
    margin-top: 17px;
}

.terms a {
    color: #087c49;
    text-decoration: none;
    font-weight: 600;
}

.error {
    display: none;
    background: #fff0f0;
    color: #c62828;
    border: 1px solid #ffcaca;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 15px;
}

@media (max-width: 480px) {
    .container {
        margin-top: 22px;
    }

    .card {
        padding: 24px 18px;
    }

    .title {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">Chat<span>Pesa</span></div>
    <a href="index.html" class="back-btn">← Home</a>
</header>

<main class="container">

    <div class="card">

        <h1 class="title">Create Your Account</h1>

        <p class="subtitle">
            Enter your details below to create your ChatPesa account.
        </p>

        <div id="errorMessage" class="error"></div>

        <form id="registrationForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <div class="phone-row">
                    <select id="countryCode" class="country-code">
                        <option value="+254">+254</option>
                        <option value="+44">+44</option>
                        <option value="+1">+1</option>
                        <option value="+27">+27</option>
                        <option value="+255">+255</option>
                        <option value="+256">+256</option>
                    </select>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        class="phone-number"
                        placeholder="712345678"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >
            </div>

            <div class="fee-box">
                <div class="fee-label">Registration Fee</div>
                <div class="fee">KSh 100</div>
            </div>

            <button type="submit" class="continue-btn">
                Continue to Payment →
            </button>

            <p class="terms">
                By continuing, you agree to the ChatPesa
                <a href="#">Terms & Conditions</a> and
                <a href="#">Privacy Policy</a>.
            </p>

        </form>

    </div>

</main>

<script>
const form = document.getElementById("registrationForm");
const errorMessage = document.getElementById("errorMessage");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const countryCode = document.getElementById("countryCode").value;
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    errorMessage.style.display = "none";

    if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match.";
        errorMessage.style.display = "block";
        return;
    }

    if (password.length < 6) {
        errorMessage.textContent = "Password must be at least 6 characters.";
        errorMessage.style.display = "block";
        return;
    }

    const userData = {
        fullName: fullName,
        username: username,
        email: email,
        phone: countryCode + phone
    };

    localStorage.setItem("chatpesaUser", JSON.stringify(userData));

    window.location.href = "payment.html";
});
</script>

</body>
</html>
