<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Your Interest | Chat & Earn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #000000;
    color: #ffffff;
    min-height: 100vh;
}

.page {
    width: 100%;
    min-height: 100vh;
    padding: 10px;
    background: #000000;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
}

header {
    text-align: center;
    padding: 18px 0 20px;
}

.logo {
    width: 52px;
    height: 52px;
    margin: auto;
    background: #00A651;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
}

header h1 {
    font-family: 'Mali', cursive;
    font-size: 27px;
    margin-top: 8px;
    font-weight: 700;
}

header h1 span {
    color: #00A651;
}

header p {
    font-size: 12px;
    color: #aaaaaa;
    margin-top: 3px;
}

.card {
    background: #111111;
    border: 1px solid #303030;
    border-radius: 15px;
    padding: 20px 15px;
}

.card h2 {
    font-size: 20px;
    text-align: center;
    margin-bottom: 5px;
}

.intro {
    text-align: center;
    color: #999999;
    font-size: 12px;
    margin-bottom: 22px;
}

.section-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #ffffff;
}

.chat-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

.chat-option {
    position: relative;
    min-height: 70px;
    background: #181818;
    border: 1px solid #3a3a3a;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
}

.chat-option .icon {
    font-size: 25px;
    margin-bottom: 3px;
}

.chat-option .name {
    font-size: 13px;
    font-weight: 600;
}

.chat-option.selected {
    border: 2px solid #00A651;
    background: #082d1b;
}

.country-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.country-option {
    position: relative;
    min-height: 55px;
    background: #181818;
    border: 1px solid #3a3a3a;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
    padding-right: 30px;
}

.country-option.selected {
    border: 2px solid #00A651;
    background: #082d1b;
}

.check {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 1px solid #555555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: transparent;
    background: #111111;
    font-weight: 700;
}

.chat-option .check {
    position: absolute;
    right: 7px;
    top: 7px;
    transform: none;
}

.selected .check {
    background: #00A651;
    border-color: #00A651;
    color: #ffffff;
}

button {
    width: 100%;
    margin-top: 22px;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: #00A651;
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    background: #333333;
    color: #777777;
    cursor: not-allowed;
}

</style>

</head>

<body>

<div class="page">

<div class="container">

<header>
    <div class="logo">🌍</div>

    <h1>Chat <span>&</span> Earn</h1>

    <p>Connect • Chat • Learn • Earn</p>
</header>


<div class="card">

    <h2>Choose Your Interest</h2>

    <p class="intro">
        Tell us who you would like to connect with.
    </p>


    <div class="section-title">
        Choose to chat with:
    </div>

    <div class="chat-options">

        <div class="chat-option" data-gender="Man">

            <div class="icon">👨</div>
            <div class="name">Man</div>

            <div class="check">✓</div>

        </div>


        <div class="chat-option" data-gender="Woman">

            <div class="icon">👩</div>
            <div class="name">Woman</div>

            <div class="check">✓</div>

        </div>

    </div>


    <div class="section-title">
        Choose a country where they're coming from:
    </div>


    <div class="country-options">

        <div class="country-option" data-country="USA">
            🇺🇸 USA
            <div class="check">✓</div>
        </div>

        <div class="country-option" data-country="Canada">
            🇨🇦 Canada
            <div class="check">✓</div>
        </div>

        <div class="country-option" data-country="Australia">
            🇦🇺 Australia
            <div class="check">✓</div>
        </div>

        <div class="country-option" data-country="UK">
            🇬🇧 UK
            <div class="check">✓</div>
        </div>

        <div class="country-option" data-country="New Zealand">
            🇳🇿 New Zealand
            <div class="check">✓</div>
        </div>

        <div class="country-option" data-country="China">
            🇨🇳 China
            <div class="check">✓</div>
        </div>

    </div>


    <button id="continueBtn" disabled>
        CONTINUE
    </button>

</div>

</div>

</div>


<script>

const chatOptions = document.querySelectorAll(".chat-option");
const countryOptions = document.querySelectorAll(".country-option");
const continueBtn = document.getElementById("continueBtn");

let selectedGender = "";
let selectedCountry = "";


chatOptions.forEach(function(option) {

    option.addEventListener("click", function() {

        chatOptions.forEach(function(item) {
            item.classList.remove("selected");
        });

        option.classList.add("selected");

        selectedGender = option.getAttribute("data-gender");

        checkReady();

    });

});


countryOptions.forEach(function(option) {

    option.addEventListener("click", function() {

        countryOptions.forEach(function(item) {
            item.classList.remove("selected");
        });

        option.classList.add("selected");

        selectedCountry = option.getAttribute("data-country");

        checkReady();

    });

});


function checkReady() {

    if (selectedGender && selectedCountry) {

        continueBtn.disabled = false;

    } else {

        continueBtn.disabled = true;

    }

}


continueBtn.addEventListener("click", function() {

    if (!selectedGender || !selectedCountry) return;

    localStorage.setItem("chatWith", selectedGender);
    localStorage.setItem("chatCountry", selectedCountry);

    continueBtn.disabled = true;
    continueBtn.innerHTML = "PLEASE WAIT...";

    setTimeout(function() {

        window.location.href = "payment.html";

    }, 500);

});

</script>

</body>
</html>
