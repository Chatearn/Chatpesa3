<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Interest | Chat & Earn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000000;
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
}

.page {
    width: 100%;
    min-height: 100vh;
    background: #000000;
    padding: 10px;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}


/* HEADER */

.header {
    text-align: center;
    margin-bottom: 10px;
}

.logo {
    width: 52px;
    height: 52px;

    margin: 0 auto 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #00A651;
    border-radius: 50%;

    font-size: 28px;
}

.header h1 {
    color: #ffffff;

    font-size: 28px;

    font-weight: 900;

    line-height: 1.1;

    margin-bottom: 4px;
}

.header h1 span {
    color: #00A651;
}

.header p {
    color: #dddddd;

    font-family: 'Mali', cursive;

    font-size: 12px;

    font-weight: 600;

    line-height: 1.3;
}


/* CARD */

.card {
    background: #111111;

    border: 1px solid #303030;

    border-radius: 15px;

    padding: 18px 13px;
}

.card h2 {
    color: #ffffff;

    text-align: center;

    font-size: 20px;

    font-weight: 900;

    margin-bottom: 4px;
}

.intro {
    color: #999999;

    text-align: center;

    font-family: 'Mali', cursive;

    font-size: 11px;

    font-weight: 600;

    margin-bottom: 18px;
}


/* INTEREST OPTIONS */

.options {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-bottom: 16px;
}

.option {
    width: 100%;

    min-height: 58px;

    padding: 10px 13px;

    display: flex;

    align-items: center;

    gap: 12px;

    background: #181818;

    border: 2px solid #333333;

    border-radius: 11px;

    color: #ffffff;

    cursor: pointer;

    transition: 0.2s ease;
}

.option:hover {
    border-color: #00A651;
}

.option.selected {
    border-color: #00A651;

    background: rgba(0, 166, 81, 0.10);

    box-shadow:
        0 0 0 1px rgba(0, 166, 81, 0.15);
}

.option-icon {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #00A651;

    border-radius: 10px;

    font-size: 20px;
}

.option-content {
    flex: 1;
}

.option-title {
    font-size: 14px;

    font-weight: 800;

    margin-bottom: 1px;
}

.option-description {
    color: #999999;

    font-size: 10px;

    font-weight: 500;
}

.check {
    width: 22px;
    height: 22px;

    flex-shrink: 0;

    border: 2px solid #555555;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;
}

.option.selected .check {
    background: #00A651;

    border-color: #00A651;

    color: #ffffff;
}


/* CONTINUE */

.continue-btn {
    width: 100%;

    height: 52px;

    margin-top: 3px;

    background: #00A651;

    color: #ffffff;

    border: none;

    border-radius: 10px;

    font-family: 'Poppins', sans-serif;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,166,81,.25);

    transition: 0.2s ease;
}

.continue-btn:active {
    transform: scale(.98);
}

.continue-btn:disabled {
    opacity: .7;

    cursor: not-allowed;
}


/* FOOTER */

.footer {
    text-align: center;

    padding-top: 8px;
}

.footer p {
    color: #777777;

    font-family: 'Mali', cursive;

    font-size: 10px;

    font-weight: 600;
}


/* SMALL PHONES */

@media (max-width: 360px) {

    .page {
        padding: 6px 8px;
    }

    .logo {
        width: 45px;
        height: 45px;
        font-size: 24px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        font-size: 11px;
    }

    .card {
        padding: 14px 10px;
    }

    .option {
        min-height: 54px;

        padding: 8px 10px;
    }

    .option-icon {
        width: 36px;
        height: 36px;
    }

    .option-title {
        font-size: 13px;
    }

    .continue-btn {
        height: 48px;

        font-size: 17px;
    }
}

</style>

</head>

<body>

<div class="page">

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🌍
        </div>

        <h1>
            Chat <span>&</span> Earn
        </h1>

        <p>
            Connect • Chat • Learn • Earn
        </p>

    </div>


    <!-- INTEREST CARD -->

    <div class="card">

        <h2>
            Who Would You Like To Chat With?
        </h2>

        <p class="intro">
            Choose your preferred connection.
        </p>


        <div class="options">


            <!-- MEN -->

            <div
                class="option"
                data-value="Men"
            >

                <div class="option-icon">
                    👨
                </div>

                <div class="option-content">

                    <div class="option-title">
                        Men
                    </div>

                    <div class="option-description">
                        Connect and chat with men.
                    </div>

                </div>

                <div class="check">
                    ✓
                </div>

            </div>


            <!-- WOMEN -->

            <div
                class="option"
                data-value="Women"
            >
