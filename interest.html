<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Your Interest | Chat & Earn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000000;
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
}

.page {
    width: 100%;
    min-height: 100vh;
    background: #000000;
    padding: 10px;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}


/* HEADER */

.header {
    text-align: center;
    margin-bottom: 10px;
}

.logo {
    width: 52px;
    height: 52px;

    margin: 0 auto 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #00A651;
    border-radius: 50%;

    font-size: 28px;
}

.header h1 {
    color: #ffffff;

    font-family: 'Poppins', sans-serif;

    font-size: 28px;

    font-weight: 900;

    line-height: 1.1;

    margin-bottom: 4px;
}

.header h1 span {
    color: #00A651;
}

.header p {
    color: #dddddd;

    font-family: 'Mali', cursive;

    font-size: 12px;

    font-weight: 600;

    line-height: 1.3;
}


/* CARD */

.card {
    background: #111111;

    border: 1px solid #303030;

    border-radius: 15px;

    padding: 15px 13px;
}

.card h2 {
    color: #ffffff;

    text-align: center;

    font-size: 19px;

    font-weight: 900;

    margin-bottom: 3px;
}

.intro {
    color: #999999;

    text-align: center;

    font-family: 'Mali', cursive;

    font-size: 11px;

    font-weight: 600;

    margin-bottom: 15px;
}


/* SECTION TITLE */

.section-title {
    color: #ffffff;

    font-size: 13px;

    font-weight: 900;

    margin-bottom: 7px;
}


/* CHAT OPTIONS */

.chat-options {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-bottom: 15px;
}

.chat-option {
    min-height: 70px;

    background: #181818;

    border: 2px solid #3a3a3a;

    border-radius: 11px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    color: #ffffff;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.2s ease;
}

.chat-option:hover {
    border-color: #00A651;
}

.chat-option.selected {
    background: rgba(0,166,81,.10);

    border-color: #00A651;

    box-shadow:
        0 0 0 1px rgba(0,166,81,.15);
}

.chat-icon {
    font-size: 27px;
}


/* COUNTRY OPTIONS */

.country-options {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-bottom: 15px;
}

.country-option {
    min-height: 58px;

    padding: 8px;

    background: #181818;

    border: 2px solid #3a3a3a;

    border-radius: 11px;

    display: flex;

    align-items: center;

    gap: 8px;

    color: #ffffff;

    cursor: pointer;

    transition: 0.2s ease;
}

.country-option:hover {
    border-color: #00A651;
}

.country-option.selected {
    background: rgba(0,166,81,.10);

    border-color: #00A651;

    box-shadow:
        0 0 0 1px rgba(0,166,81,.15);
}

.flag {
    font-size: 25px;

    flex-shrink: 0;
}

.country-name {
    font-size: 12px;

    font-weight: 800;

    line-height: 1.2;
}


/* CHECK */

.check {
    margin-left: auto;

    width: 19px;
    height: 19px;

    border: 2px solid #555555;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: transparent;

    font-size: 10px;

    flex-shrink: 0;
}

.selected .check {
    background: #00A651;

    border-color: #00A651;

    color: #ffffff;
}


/* CONTINUE */

.continue-btn {
    width: 100%;

    height: 52px;

    margin-top: 2px;

    background: #00A651;

    color: #ffffff;

    border: none;

    border-radius: 10px;

    font-family: 'Poppins', sans-serif;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,166,81,.25);

    transition: 0.2s ease;
}

.continue-btn:active {
    transform: scale(.98);
}

.continue-btn:disabled {
    opacity: .45;

    cursor: not-allowed;

    box-shadow: none;
}


/* FOOTER */

.footer {
    text-align: center;

    padding-top: 8px;
}

.footer p {
    color: #777777;

    font-family: 'Mali', cursive;

    font-size: 10px;

    font-weight: 600;
}


/* SMALL PHONES */

@media (max-width: 360px) {

    .page {
        padding: 6px 8px;
    }

    .logo {
        width: 45px;
        height: 45px;

        font-size: 24px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        font-size: 11px;
    }

    .card {
        padding: 12px 10px;
    }

    .chat-option {
        min-height: 62px;

        font-size: 13px;
    }

    .chat-icon {
        font-size: 23px;
    }

    .country-option {
        min-height: 54px;
    }

    .country-name {
        font-size: 11px;
    }

    .flag {
        font-size: 22px;
    }

    .continue-btn {
        height: 48px;

        font-size: 17px;
    }
}

</style>

</head>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <p>
            Chat • Connect • Learn • Earn

    </div>


</div>

</div>
