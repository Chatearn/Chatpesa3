<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ChatPesa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4fff8, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #17251d;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #087f3f;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo p {
      color: #66736b;
      font-size: 14px;
      margin-top: 6px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid #e8eee9;
    }

    .card h2 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6c766f;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d7dfda;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #fbfdfb;
    }

    input:focus {
      border-color: #087f3f;
      box-shadow: 0 0 0 3px rgba(8, 127, 63, 0.10);
      background: #ffffff;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #5d6861;
    }

    .remember input {
      width: auto;
      accent-color: #087f3f;
    }

    .forgot {
      color: #087f3f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 13px;
      background: #087f3f;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #066b35;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      color: #9aa39d;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e4e9e5;
    }

    .register {
      text-align: center;
      font-size: 14px;
      color: #68736c;
    }

    .register a {
      color: #087f3f;
      font-weight: 700;
      text-decoration: none;
    }

    .security {
      text-align: center;
      margin-top: 20px;
      color: #8a938d;
      font-size: 12px;
    }

    .error {
      display: none;
      background: #fff1f1;
      color: #c62828;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 380px) {
      .card {
        padding: 25px 18px;
      }

      .password-row {
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>ChatPesa</h1>
      <p>Connect. Chat. Earn.</p>
    </div>

    <div class="card">

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to your ChatPesa account</p>

      <div class="error" id="errorMessage">
        Please enter your phone/email and password.
      </div>

      <form id="loginForm">

        <div class="input-group">
          <label for="login">Phone or Email</label>
          <input
            type="text"
            id="login"
            placeholder="Enter phone or email"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="password-row">
          <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
          </label>

          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

      </form>

      <div class="divider">OR</div>

      <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </div>

    </div>

    <div class="security">
      🔒 Your account information is protected.
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const login = document.getElementById("login").value.trim();
      const password = document.getElementById("password").value.trim();
      const error = document.getElementById("errorMessage");

      if (!login || !password) {
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      /*
        Authentication will be connected later.
        Do NOT store real passwords in this HTML file.
      */

      alert("Login system will be connected to the ChatPesa account system next.");
    });
  </script>

</body>
</html>
