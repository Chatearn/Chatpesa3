<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatPesa - Activate Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#090214,#18042e,#26063d);
    color:white;
}

.card{
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

.subtitle{
    color:#ddd;
    line-height:1.6;
    margin-bottom:25px;
}

.price{
    text-align:center;
    padding:20px;
    margin-bottom:25px;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
}

.price p{
    color:#ddd;
    margin-bottom:5px;
}

.price h2{
    font-size:38px;
    color:#ff5ab5;
}

.phone-box{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:#fff;
}

.phone-label{
    font-size:12px;
    color:#bbb;
    margin-bottom:6px;
}

.phone-number{
    font-size:18px;
    font-weight:bold;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:40px;
    background:linear-gradient(90deg,#ff2f92,#ff5ab5);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

#status{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    line-height:1.5;
    background:rgba(255,255,255,0.08);
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#ddd;
    text-decoration:none;
    font-size:13px;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#bbb;
    font-size:13px;
    line-height:1.8;
}

</style>

</head>

<body>

<div class="card">

    <h1>ChatPesa</h1>

    <p class="subtitle">
        Complete your registration securely.
    </p>

    <div class="price">

        <p>Registration Fee</p>

        <h2>KSh 100</h2>

        <p>One-time registration payment</p>

    </div>


    <div class="phone-box">

        <div class="phone-label">
            M-PESA Phone Number
        </div>

        <div
            class="phone-number"
            id="phoneDisplay"
        >
            Loading...
        </div>

    </div>


    <button
        id="payButton"
        onclick="payNow()"
    >
        Continue
    </button>


    <div id="status"></div>


    <a
        href="register.html"
        class="back"
    >
        ← Back to registration
    </a>


    <div class="footer">
        🔐 Secure payment<br>
        Your payment information is handled securely.
    </div>

</div>


<script>

/* =========================================
   CHATPESA BACKEND
   DO NOT CHANGE THIS URL
========================================= */

const backend =
    "https://chatpesa-backend.onrender.com";


const phoneDisplay =
    document.getElementById("phoneDisplay");

const status =
    document.getElementById("status");

const button =
    document.getElementById("payButton");


/* =========================================
   SHOW STATUS
========================================= */

function showStatus(message){

    status.style.display = "block";

    status.innerHTML = message;

}


/* =========================================
   GET REGISTRATION DATA
========================================= */

let registration = null;

try{

    registration =
        JSON.parse(
            localStorage.getItem(
                "chatpesaRegistration"
            )
        );

}catch(error){

    registration = null;

}


/* =========================================
   CHECK REGISTRATION
========================================= */

if(
    !registration ||
    !registration.phone
){

    phoneDisplay.innerHTML =
        "No phone number found.";

    button.disabled = true;

    showStatus(
        "❌ Please go back and complete registration first."
    );

}else{

    let phone =
        registration.phone
        .trim()
        .replace(/\s+/g,"");


    /* Convert 07XXXXXXXX */

    if(phone.startsWith("07")){

        phone =
            "254" +
            phone.substring(1);

    }


    /* Convert +254XXXXXXXXX */

    if(phone.startsWith("+254")){

        phone =
            phone.substring(1);

    }


    /* Validate */

    if(!/^2547\d{8}$/.test(phone)){

        phoneDisplay.innerHTML =
            "Invalid phone number.";

        button.disabled = true;

        showStatus(
            "❌ The phone number entered during registration is invalid."
        );

    }else{

        phoneDisplay.innerHTML =
            phone;

    }

}


/* =========================================
   START PAYMENT
========================================= */

async function payNow(){

    if(
        !registration ||
        !registration.phone
    ){

        showStatus(
            "❌ Please complete registration first."
        );

        return;

    }


    let phone =
        registration.phone
        .trim()
        .replace(/\s+/g,"");


    /* Convert Kenyan format */

    if(phone.startsWith("07")){

        phone =
            "254" +
            phone.substring(1);

    }


    if(phone.startsWith("+254")){

        phone =
            phone.substring(1);

    }


    /* Validate */

    if(!/^2547\d{8}$/.test(phone)){

        showStatus(
            "❌ Invalid Kenyan M-PESA number."
        );

        return;

    }


    button.disabled = true;

    showStatus(
        "⏳ Connecting to ChatPesa payment server..."
    );


    const reference =
        "CHATPESA-" +
        Date.now();


    try{

        const response =
            await fetch(
                backend + "/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        phone:phone,

                        amount:100,

                        reference:reference

                    })
                }
            );


        const responseText =
            await response.text();


        console.log(
            "Backend HTTP status:",
            response.status
        );

        console.log(
            "Backend response:",
            responseText
        );


        let data;


        try{

            data =
                JSON.parse(
                    responseText
                );

        }catch(error){

            data = {
                success:false,
                error:
                    responseText ||
                    "Invalid server response."
            };

        }


        /* =================================
           BACKEND ERROR
        ================================= */

        if(!response.ok){

            const errorMessage =
                data.error ||
                data.message ||
                "Payment server returned an error.";

            showStatus(
                "❌ " +
                errorMessage
            );

            button.disabled = false;

            return;

        }


        /* =================================
           STK REQUEST ACCEPTED
        ================================= */

        if(data.success === true){

            showStatus(
                "📲 STK Push sent successfully.<br><br>" +
                "Check your phone and enter your M-PESA PIN."
            );

            /*
             * We keep the reference we created.
             * Payment-status checking will be connected
             * once the backend status endpoint exists.
             */

            console.log(
                "ChatPesa reference:",
                reference
            );

            return;

        }


        /* =================================
           UNKNOWN RESPONSE
        ================================= */

        showStatus(
            "⚠️ Payment server responded, " +
            "but the payment status could not be confirmed."
        );

        console.log(
            "Unexpected payment response:",
            data
        );

        button.disabled = false;


    }catch(error){

        console.error(
            "ChatPesa connection error:",
            error
        );


        showStatus(
            "❌ Unable to connect to ChatPesa payment server."
        );


        button.disabled = false;

    }

}

</script>

</body>
</html>
