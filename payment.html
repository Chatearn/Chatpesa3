<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | ChatPesa</title>

<meta name="description" content="Complete your ChatPesa registration payment securely using M-PESA.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.20), transparent 35%),
        linear-gradient(135deg, #180629 0%, #3b0764 48%, #6d28d9 100%);
    color: #21152f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
}

.card {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 28px;
    padding: 30px 24px;
    box-shadow: 0 25px 70px rgba(24, 6, 41, 0.35);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    color: #3b0764;
    margin-bottom: 8px;
}

.logo span {
    color: #8b5cf6;
}

.subtitle {
    color: #756c80;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.payment-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 22px;
    background: linear-gradient(135deg, #3b0764, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
    box-shadow: 0 12px 30px rgba(109, 40, 217, 0.28);
}

h1 {
    font-size: 25px;
    color: #21152f;
    margin-bottom: 8px;
}

.amount-box {
    margin: 22px 0;
    padding: 20px;
    border-radius: 20px;
    background: #f2eaff;
    border: 1px solid rgba(109, 40, 217, 0.10);
}

.amount-label {
    font-size: 13px;
    color: #756c80;
    margin-bottom: 5px;
}

.amount {
    font-size: 34px;
    font-weight: 900;
    color: #5b21b6;
}

.form-group {
    text-align: left;
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: #3b0764;
    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 54px;
    padding: 0 16px;
    border: 1.5px solid #ddd3e8;
    border-radius: 15px;
    outline: none;
    font-size: 16px;
    color: #21152f;
    background: #fff;
    transition: 0.2s ease;
}

input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.10);
}

button {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #3b0764, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 25px rgba(59, 7, 100, 0.25);
    transition: transform 0.2s ease, opacity 0.2s ease;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

.status {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.5;
}

.status.info {
    display: block;
    background: #f2eaff;
    color: #4c1d95;
}

.status.success {
    display: block;
    background: #ecfdf5;
    color: #047857;
}

.status.error {
    display: block;
    background: #fef2f2;
    color: #b91c1c;
}

.spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
    animation: spin 0.8s linear infinite;
}

.processing-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(109,40,217,0.18);
    border-top-color: #6d28d9;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.security {
    margin-top: 20px;
    font-size: 12px;
    color: #756c80;
    line-height: 1.5;
}

.security strong {
    color: #4c1d95;
}

.footer {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    text-align: center;
}

@media (max-width: 420px) {
    body {
        padding: 14px;
    }

    .card {
        padding: 25px 18px;
        border-radius: 24px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            Chat<span>Pesa</span>
        </div>

        <div class="payment-icon">
            ₿
        </div>

        <h1>Complete Registration</h1>

        <p class="subtitle">
            Make your registration payment using M-PESA to continue to ChatPesa.
        </p>

        <div class="amount-box">
            <div class="amount-label">Registration Fee</div>
            <div class="amount">KSh 1</div>
        </div>

        <div class="form-group">
            <label for="phone">M-PESA Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="07XXXXXXXX"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="13"
            >
        </div>

        <button id="payButton" type="button">
            Pay KSh 1 with M-PESA
        </button>

        <div id="status" class="status"></div>

        <div class="security">
            🔒 Your payment is processed securely through
            <strong>Paylor</strong>.
            <br>
            You will receive an M-PESA STK Push on your phone.
        </div>

    </div>

    <div class="footer">
        © 2026 ChatPesa. All rights reserved.
    </div>

</div>

<script>

const BACKEND_URL =
    "https://chatpesa-backend.onrender.com";

const REGISTRATION_AMOUNT = 1;

const phoneInput =
    document.getElementById("phone");

const payButton =
    document.getElementById("payButton");

const statusBox =
    document.getElementById("status");


function showStatus(message, type) {

    statusBox.className =
        "status " + type;

    statusBox.innerHTML =
        message;
}


function normalizePhone(phone) {

    phone = phone.replace(/\s+/g, "");

    if (/^0[17]\d{8}$/.test(phone)) {

        return "254" +
            phone.substring(1);

    }

    if (/^\+254[17]\d{8}$/.test(phone)) {

        return phone.substring(1);

    }

    if (/^254[17]\d{8}$/.test(phone)) {

        return phone;

    }

    return null;
}


payButton.addEventListener("click", async function () {

    const enteredPhone =
        phoneInput.value.trim();

    const phone =
        normalizePhone(enteredPhone);


    if (!phone) {

        showStatus(
            "Please enter a valid Kenyan M-PESA number, for example 0712345678.",
            "error"
        );

        phoneInput.focus();

        return;
    }


    payButton.disabled = true;

    payButton.innerHTML =
        '<span class="spinner"></span>Sending STK Push...';


    showStatus(
        "Connecting to M-PESA. Please wait...",
        "info"
    );


    const reference =
        "CHATPESA-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


    try {

        const response = await fetch(
            BACKEND_URL + "/stk-push",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    phone: phone,

                    amount: REGISTRATION_AMOUNT,

                    reference: reference,

                    type: "registration"

                })
            }
        );


        let data;

        try {

            data =
                await response.json();

        } catch (jsonError) {

            throw new Error(
                "The payment server returned an invalid response."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to start M-PESA payment."
            );

        }


        showStatus(
            "📱 STK Push sent successfully.<br><br>" +
            "Check your M-PESA phone and enter your M-PESA PIN to complete the payment.",
            "info"
        );


        payButton.innerHTML =
            '<span class="spinner"></span>Waiting for payment...';


        checkPaymentStatus(reference);


    } catch (error) {

        console.error(
            "ChatPesa payment error:",
            error
        );


        showStatus(
            "❌ " +
            (
                error.message ||
                "Unable to start the payment. Please try again."
            ),
            "error"
        );


        payButton.disabled = false;

        payButton.innerHTML =
            "Pay KSh 1 with M-PESA";
    }

});


let pollingTimer = null;

let pollingAttempts = 0;

const MAX_POLLING_ATTEMPTS = 40;

const POLLING_INTERVAL = 3000;


function checkPaymentStatus(reference) {

    pollingAttempts = 0;


    if (pollingTimer) {

        clearTimeout(pollingTimer);

    }


    async function check() {

        pollingAttempts++;


        try {

            const response = await fetch(

                BACKEND_URL +
                "/payment-status/" +
                encodeURIComponent(reference),

                {
                    method: "GET",
                    cache: "no-store"
                }

            );


            if (!response.ok) {

                throw new Error(
                    "Unable to check payment status."
                );

            }


            const data =
                await response.json();


            console.log(
                "ChatPesa payment status:",
                data
            );


            /*
            =============================================
            PAYMENT SUCCESS
            =============================================
            */

            if (
                data.status === "SUCCESS" ||
                data.status === "COMPLETED"
            ) {

                clearTimeout(pollingTimer);


                /*
                -----------------------------------------
                FIRST: SHOW SUCCESS
                -----------------------------------------
                */

                showStatus(

                    "✅ <strong
