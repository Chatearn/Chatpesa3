<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | ChatPesa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #ffffff;
}

.payment-container {
    width: 100%;
    max-width: 450px;
    background: #111111;
    border: 1px solid #303030;
    border-radius: 24px;
    padding: 35px 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 8px;
}

.logo span {
    color: #00A651;
}

.subtitle {
    text-align: center;
    color: #aaaaaa;
    font-size: 14px;
    margin-bottom: 30px;
}

.payment-icon {
    width: 75px;
    height: 75px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #00A651;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
}

h1 {
    text-align: center;
    color: #ffffff;
    font-size: 25px;
    margin-bottom: 10px;
}

.description {
    text-align: center;
    color: #aaaaaa;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.fee-box {
    background: #082d1b;
    border: 1px solid #00A651;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    margin-bottom: 25px;
}

.fee-label {
    font-size: 13px;
    color: #aaaaaa;
    margin-bottom: 5px;
}

.fee {
    font-size: 30px;
    font-weight: 800;
    color: #00A651;
}

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
}

.input-group input {
    width: 100%;
    padding: 15px;
    background: #181818;
    color: #ffffff;
    border: 1px solid #3a3a3a;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

.input-group input::placeholder {
    color: #777777;
}

.input-group input:focus {
    border-color: #00A651;
    box-shadow: 0 0 0 3px rgba(0,166,81,0.12);
}

.pay-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    background: #00A651;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

.pay-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,166,81,0.3);
}

.pay-button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

.status {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}

.status.info {
    display: block;
    background: #082d1b;
    color: #00A651;
    border: 1px solid #00A651;
}

.status.success {
    display: block;
    background: #082d1b;
    color: #00A651;
    border: 1px solid #00A651;
}

.status.error {
    display: block;
    background: #2a0b0b;
    color: #ff6b6b;
    border: 1px solid #7f1d1d;
}

.spinner {
    width: 22px;
    height: 22px;
    border: 3px solid rgba(0,166,81,0.2);
    border-top-color: #00A651;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 10px auto;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* ================= LIVE ACTIVITY ================= */

.live-activity {
    margin-top: 28px;
    padding: 17px;
    background: #111111;
    border: 1px solid #303030;
    border-radius: 16px;
}

.live-activity-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.live-title {
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
}

.live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #00A651;
    font-size: 11px;
    font-weight: 700;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00A651;
    box-shadow: 0 0 0 4px rgba(0,166,81,0.12);
}

.activity-message {
    min-height: 78px;
    padding: 13px;
    background: #181818;
    border: 1px solid #303030;
    border-radius: 12px;
    color: #ffffff;
    font-size: 13px;
    line-height: 1.55;
    transition: opacity 0.3s ease;
}

.activity-message strong {
    font-weight: 800;
}

.activity-message .activity-text {
    display: block;
    margin-top: 3px;
}

.activity-message .sample-label {
    display: block;
    margin-top: 7px;
    color: #777777;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
}


/* ================= MOBILE ================= */

@media (max-width: 480px) {
    .payment-container {
        padding: 30px 20px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="payment-container">

<div class="logo">
    Chat<span>Pesa</span>
</div>

<div class="subtitle">
    Connect. Chat. Earn.
</div>

<div class="payment-icon">
    KSh
</div>

<h1>Complete Your Registration</h1>

<p class="description">
    Pay the registration fee below using M-PESA to activate your ChatPesa account.
</p>

<div class="fee-box">
    <div class="fee-label">Registration Fee</div>
    <div class="fee">KSh 100</div>
</div>

<div class="input-group">
    <label for="phone">M-PESA Phone Number</label>
    <input
        type="tel"
        id="phone"
        placeholder="07XXXXXXXX"
        maxlength="13"
        autocomplete="tel"
    >
</div>

<button
    type="button"
    class="pay-button"
    id="payButton"
    onclick="makePayment()"
>
    Pay KSh 100
</button>

<div id="status" class="status"></div>


<!-- ================= LIVE ACTIVITY ================= -->

<div class="live-activity">

    <div class="live-activity-header">

        <div class="live-title">
            Recent Activity
        </div>

        <div class="live-indicator">
            <span class="live-dot"></span>
            LIVE
        </div>

    </div>

    <div
        id="activityMessage"
        class="activity-message"
    ></div>

</div>


<div class="security">
    🔒 Secure M-PESA payment
</div>

</div>

<script>

const BACKEND_URL =
    "https://chatpesa-backend.onrender.com";

let pollingTimer = null;
let paymentFinished = false;

function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.className =
        "status " + type;

    status.innerHTML =
        message;
}

function normalizePhone(phone) {

    phone = String(phone)
        .replace(/\s+/g, "")
        .trim();

    if (phone.startsWith("+254")) {
        phone = phone.substring(1);
    }

    if (
        phone.startsWith("07") ||
        phone.startsWith("01")
    ) {
        phone =
            "254" + phone.substring(1);
    }

    return phone;
}

function isValidPhone(phone) {

    return /^254(7|1)[0-9]{8}$/.test(phone);

}

async function makePayment() {

    if (paymentFinished) {
        return;
    }

    const phoneInput =
        document.getElementById("phone");

    const payButton =
        document.getElementById("payButton");

    let phone =
        normalizePhone(
            phoneInput.value
        );

    if (!isValidPhone(phone)) {

        showStatus(
            "Please enter a valid Kenyan M-PESA number.",
            "error"
        );

        return;
    }

    payButton.disabled = true;

    payButton.innerHTML =
        "Sending payment request...";

    showStatus(
        "Please wait while we send the M-PESA payment request to your phone.",
        "info"
    );

    const reference =
        "CHATPESA-" + Date.now();

    try {

        const response =
            await fetch(
                BACKEND_URL + "/stk-push",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        phone: phone,

                        amount: 100,

                        reference: reference,

                        type: "registration"

                    })
                }
            );

        let data = {};

        try {

            data =
                await response.json();

        } catch (jsonError) {

            throw new Error(
                "The payment server returned an invalid response."
            );

        }

        console.log(
            "STK PUSH RESPONSE:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to start payment."
            );
        }

        if (!data.success) {

            throw new Error(
                data.message ||
                "Payment request was not accepted."
            );
        }

        showStatus(

            "📱 <strong>Payment request sent!</strong><br><br>" +
            "Check your phone and enter your M-PESA PIN to complete the payment.",

            "info"

        );

        checkPaymentStatus(
            reference
        );

    } catch (error) {

        console.error(
            "PAYMENT ERROR:",
            error
        );

        payButton.disabled = false;

        payButton.innerHTML =
            "Pay KSh 100";

        showStatus(

            "❌ " +
            (
                error.message ||
                "Unable to start payment. Please try again."
            ),

            "error"

        );
    }
}

async function checkPaymentStatus(reference) {

    if (paymentFinished) {
        return;
    }

    try {

        const response =
            await fetch(

                BACKEND_URL +
                "/payment-status/" +
                encodeURIComponent(
                    reference
                )

            );

        const data =
            await response.json();

        console.log(
            "Payment status:",
            data
        );

        if (
            data.status === "SUCCESS" ||
            data.status === "COMPLETED"
        ) {

            paymentFinished = true;

            clearTimeout(
                pollingTimer
            );

            const payButton =
                document.getElementById(
                    "payButton"
                );

            showStatus(

                "✅ <strong>Payment Successful!</strong><br><br>" +
                "Your registration payment has been confirmed.",

                "success"

            );

            payButton.innerHTML =
                "Payment Successful ✓";

            payButton.disabled = true;

            setTimeout(
                function () {

                    window.location.href =
                        "countries.html";

                },
                3000
            );

            return;
        }

        if (
            data.status === "FAILED" ||
            data.status === "CANCELLED"
        ) {

            const payButton =
                document.getElementById(
                    "payButton"
                );

            payButton.disabled = false;

            payButton.innerHTML =
                "Pay KSh 100";

            showStatus(

                "❌ Payment was not completed. Please try again.",

                "error"

            );

            return;
        }

        showStatus(

            "⏳ Waiting for payment confirmation...<br><br>" +
            "Please complete the M-PESA request on your phone.",

            "info"

        );

        pollingTimer =
            setTimeout(

                function () {

                    checkPaymentStatus(
                        reference
                    );

                },

                3000

            );

    } catch (error) {

        console.error(
            "Payment status error:",
            error
        );

        pollingTimer =
            setTimeout(

                function () {

                    checkPaymentStatus(
                        reference
                    );

                },

                4000

            );
    }
}

const countries = [

    "USA 🇺🇸",
    "Canada 🇨🇦",
    "UK 🇬🇧"

];

const activityTypes = [

    "connection",
    "scholarship",
    "job",
    "companion"

];

let lastName = "";
let lastActivity = "";

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}

function getRandomName() {

    let name;

    do {

        name =
            randomItem(
                kenyanNames
            );

    } while (
        name === lastName &&
        kenyanNames.length > 1
    );

    lastName = name;

    return name;
}

function getRandomActivity() {

    let activity;

    do {

        activity =
            randomItem(
                activityTypes
            );

    } while (
        activity === lastActivity &&
        activityTypes.length > 1
    );

    lastActivity = activity;

    return activity;
}

function createActivityMessage() {

    const name =
        getRandomName();

    const country =
        randomItem(
            countries
        );

    const activity =
        getRandomActivity();

    let message = "";

    if (activity === "connection") {

        message =
            "🎊🎉 <strong>Congratulations!</strong>" +
            '<span class="activity-text">' +
            name +
            " just got connected with someone in " +
            country +
            "</span>";

    }

    if (activity === "scholarship") {

        message =
            "🎊🎉 <strong>Congratulations!</strong>" +
            '<span class="activity-text">' +
            name +
            " just got an education scholarship 🎓 from " +
            country +
            "</span>";

    }

    if (activity === "job") {

        message =
            "🎊🎉 <strong>Congratulations!</strong>" +
            '<span class="activity-text">' +
            name +
            " just got a job opportunity 💼 from " +
            country +
            "</span>";

    }

    if (activity === "companion") {

        message =
            "🎊🎉 <strong>Congratulations!</strong>" +
            '<span class="activity-text">' +
            name +
            " just found a companion ❤️ in " +
            country +
            "</span>";

    }

    message +=
        '<span class="sample-label">' +
        "Sample activity" +
        "</span>";

    return message;

}

function updateLiveActivity() {

    const activityBox =
        document.getElementById(
            "activityMessage"
        );

    activityBox.style.opacity = "0";

    setTimeout(
        function () {

            activityBox.innerHTML =
                createActivityMessage();

            activityBox.style.opacity = "1";

        },
        300
    );

}


/* First message */

updateLiveActivity();


/* New random message every 5 seconds */

setInterval(
    updateLiveActivity,
    5000
);
