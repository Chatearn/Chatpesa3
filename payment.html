<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatPesa Payment</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.payment-container {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 15px;
    padding: 30px 22px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #16a34a;
}

h1 {
    font-size: 24px;
    margin-bottom: 8px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

.payment-box {
    background: #f8f8f8;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.amount {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 15px;
}

.phone-label {
    font-size: 14px;
    color: #666;
    margin-bottom: 5px;
}

.phone {
    font-size: 19px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #12823a;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#status {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #f1f1f1;
    font-size: 14px;
    line-height: 1.5;
}

.success {
    background: #dcfce7 !important;
    color: #166534;
    font-weight: bold;
    font-size: 17px !important;
}

.failed {
    background: #fee2e2 !important;
    color: #991b1b;
}

.security {
    margin-top: 20px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="payment-container">

    <div class="logo">
        Chat<span>Pesa</span>
    </div>

    <h1>Complete Registration</h1>

    <p class="subtitle">
        Make your one-time registration payment
    </p>

    <div class="payment-box">

        <div class="amount">
            KSh 100
        </div>

        <div class="phone-label">
            M-PESA Phone Number
        </div>

        <div class="phone" id="phoneDisplay">
            Loading...
        </div>

    </div>

    <button id="payButton" onclick="payNow()">
        Pay KSh 100 with M-PESA
    </button>

    <div id="status"></div>

    <div class="security">
        🔐 Secure M-PESA payment
    </div>

</div>


<script>

const backend =
    "https://chatpesa-backend.onrender.com";

const phoneDisplay =
    document.getElementById("phoneDisplay");

const status =
    document.getElementById("status");

const button =
    document.getElementById("payButton");


function showStatus(message, type = "") {

    status.style.display = "block";

    status.className = type;

    status.innerHTML = message;

}


/* =========================================
   GET REGISTRATION DATA
========================================= */

let registration = null;

try {

    const saved =
        localStorage.getItem(
            "chatpesaRegistration"
        );

    if (saved) {

        registration =
            JSON.parse(saved);

    }

} catch (error) {

    console.error(
        "Registration data error:",
        error
    );

}


/* =========================================
   FORMAT PHONE
========================================= */

function formatPhone(phone) {

    let number =
        String(phone)
            .trim()
            .replace(/\s+/g, "");

    if (number.startsWith("07")) {

        number =
            "254" +
            number.substring(1);

    }

    if (number.startsWith("+254")) {

        number =
            number.substring(1);

    }

    return number;

}


/* =========================================
   LOAD PHONE
========================================= */

if (
    !registration ||
    !registration.phone
) {

    phoneDisplay.innerHTML =
        "No phone number found.";

    button.disabled = true;

    showStatus(
        "❌ Please go back and complete registration first.",
        "failed"
    );

} else {

    const phone =
        formatPhone(
            registration.phone
        );

    if (!/^2547\d{8}$/.test(phone)) {

        phoneDisplay.innerHTML =
            "Invalid phone number.";

        button.disabled = true;

        showStatus(
            "❌ Invalid Kenyan M-PESA number.",
            "failed"
        );

    } else {

        phoneDisplay.innerHTML =
            phone;

    }

}


/* =========================================
   CHECK PAYMENT STATUS
========================================= */

async function checkPaymentStatus(reference) {

    console.log(
        "Checking payment status:",
        reference
    );

    try {

        const response =
            await fetch(
                backend +
                "/payment-status/" +
                encodeURIComponent(reference)
            );

        const data =
            await response.json();

        console.log(
            "PAYMENT STATUS:",
            data
        );


        /* ================================
           PAYMENT SUCCESS
        ================================= */

        if (
            data.status === "SUCCESS"
        ) {

            showStatus(
                "✅ You have successfully registered!",
                "success"
            );

            button.innerText =
                "Registration Successful";

            button.disabled = true;

            return true;
        }


        /* ================================
           PAYMENT FAILED
        ================================= */

        if (
            data.status === "FAILED"
        ) {

            showStatus(
                "❌ Payment was not completed. Please try again.",
                "failed"
            );

            button.disabled = false;

            button.innerText =
                "Pay KSh 100 with M-PESA";

            return true;
        }


    } catch (error) {

        console.error(
            "STATUS CHECK ERROR:",
            error
        );

    }

    return false;
}


/* =========================================
   START PAYMENT MONITORING
========================================= */

async function monitorPayment(reference) {

    let attempts = 0;

    const maxAttempts = 30;

    while (attempts < maxAttempts) {

        attempts++;

        console.log(
            "Payment check:",
            attempts,
            "/",
            maxAttempts
        );

        const finished =
            await checkPaymentStatus(
                reference
            );

        if (finished) {

            return;

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    3000
                )
        );

    }


    showStatus(
        "⚠️ Payment confirmation is taking longer than expected. If you completed the M-PESA payment, please wait a moment and refresh.",
        ""
    );

    button.disabled = false;

    button.innerText =
        "Check Payment Again";

}


/* =========================================
   PAYMENT
========================================= */

async function payNow() {

    if (
        !registration ||
        !registration.phone
    ) {

        showStatus(
            "❌ Please complete registration first.",
            "failed"
        );

        return;

    }

    const phone =
        formatPhone(
            registration.phone
        );

    if (!/^2547\d{8}$/.test(phone)) {

        showStatus(
            "❌ Invalid Kenyan M-PESA number.",
            "failed"
        );

        return;

    }

    button.disabled = true;

    button.innerText =
        "Connecting...";

    showStatus(
        "⏳ Connecting to ChatPesa payment server..."
    );


    const reference =
        "CHATPESA-" +
        Date.now();


    const requestData = {

        phone: phone,

        amount: 100,

        reference: reference

    };


    console.log(
        "CHATPESA REQUEST:",
        requestData
    );


    try {

        const response =
            await fetch(
                backend + "/stk-push",
                {

                    method: "POST",

                    mode: "cors",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            requestData
                        )

                }
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        const text =
            await response.text();


        console.log(
            "SERVER RESPONSE:",
            text
        );


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            data = {

                success: false,

                error: text

            };

        }


        if (!response.ok) {

            showStatus(
                "❌ " +
                (
                    data.error ||
                    data.message ||
                    "Payment request failed."
                ),
                "failed"
            );

            button.disabled = false;

            button.innerText =
                "Pay KSh 100 with M-PESA";

            return;

        }


        if (data.success === true) {

            showStatus(
                "📲 <strong>STK Push sent!</strong><br><br>" +
                "Check your phone and enter your M-PESA PIN.<br><br>" +
                "⏳ Waiting for payment confirmation..."
            );

            button.innerText =
                "Waiting for Payment...";


            /*
             * IMPORTANT:
             * Start checking the backend
             * for the payment result.
             */

            monitorPayment(
                reference
            );

            return;

        }


        showStatus(
            "⚠️ Server responded, but the payment could not be confirmed."
        );

        button.disabled = false;

        button.innerText =
            "Pay KSh 100 with M-PESA";


    } catch (error) {

        console.error(
            "CHATPESA CONNECTION ERROR:",
            error
        );

        showStatus(
            "❌ Connection error:<br>" +
            error.message,
            "failed"
        );

        button.disabled = false;

        button.innerText =
            "Pay KSh 100 with M-PESA";

    }

}

</script>

</body>
</html>
