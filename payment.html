<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | ChatPesa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #180629, #3b0764, #6d28d9);
    color: #21152f;
    display: flex;
    justify-content: center;
    align-items: center;
}

.payment-container {
    width: 100%;
    min-height: 100vh;
    background: #ffffff;
    padding: 35px 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    color: #3b0764;
    margin-bottom: 10px;
}

.logo span {
    color: #7c3aed;
}

.subtitle {
    text-align: center;
    color: #756c80;
    margin-bottom: 30px;
    font-size: 15px;
}

.amount-box {
    background: linear-gradient(135deg, #f2eaff, #ffffff);
    border: 1px solid rgba(109, 40, 217, 0.15);
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    margin-bottom: 25px;
}

.amount-label {
    color: #756c80;
    font-size: 14px;
    margin-bottom: 8px;
}

.amount {
    font-size: 38px;
    font-weight: 800;
    color: #6d28d9;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 9px;
    color: #21152f;
}

input {
    width: 100%;
    padding: 16px;
    border: 1px solid #ddd3eb;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: 0.2s;
    margin-bottom: 18px;
}

input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.10);
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #3b0764, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(59, 7, 100, 0.25);
}

button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

.status {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    display: none;
}

.status.success {
    display: block;
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
}

.status.error {
    display: block;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}

.status.info {
    display: block;
    background: #f5f3ff;
    color: #5b21b6;
    border: 1px solid #ddd6fe;
}

.secure {
    text-align: center;
    margin-top: 25px;
    color: #756c80;
    font-size: 13px;
}

@media (max-width: 600px) {
    .payment-container {
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<div class="payment-container">

    <div class="logo">
        Chat<span>Pesa</span>
    </div>

    <div class="subtitle">
        Complete Registration
    </div>

    <p class="subtitle">
        Make your one-time registration payment
    </p>

    <div class="amount-box">
        <div class="amount-label">Registration Fee</div>
        <div class="amount">KSh 1</div>
    </div>

    <label for="phone">
        M-PESA Phone Number
    </label>

    <input
        type="tel"
        id="phone"
        value="254742072287"
        placeholder="2547XXXXXXXX"
        autocomplete="tel"
    >

    <button id="payButton" onclick="startPayment()">
        Pay KSh 1 with M-PESA
    </button>

    <div id="status" class="status"></div>

    <div class="secure">
        🔐 Secure M-PESA payment
    </div>

</div>

<script>

const BACKEND_URL = "https://chatpesa-backend.onrender.com";

function showStatus(message, type) {
    const status = document.getElementById("status");

    status.innerText = message;
    status.className = "status " + type;
}

async function startPayment() {

    const phone = document
        .getElementById("phone")
        .value
        .trim();

    const button = document.getElementById("payButton");

    if (!phone) {
        showStatus(
            "Please enter your M-PESA phone number.",
            "error"
        );
        return;
    }

    button.disabled = true;
    button.innerText = "Sending M-PESA Request...";

    showStatus(
        "Please check your phone and enter your M-PESA PIN.",
        "info"
    );

    const reference =
        "CP-" +
        Date.now();

    try {

        const response = await fetch(
            BACKEND_URL + "/stk-push",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    phone: phone,
                    amount: 1,
                    reference: reference,
                    type: "registration"
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Payment request failed."
            );

        }

        if (
            data.status === "SUCCESS"
        ) {

            showStatus(
                "✅ You have successfully registered!",
                "success"
            );

            button.innerText =
                "Registration Successful";

            button.disabled = true;

            setTimeout(() => {

                window.location.href =
                    "countries.html";

            }, 1500);

            return true;
        }

        showStatus(
            data.message ||
            "M-PESA payment request sent. Please complete the payment.",
            "info"
        );

        button.innerText =
            "Waiting for Payment...";

        checkPaymentStatus(reference);

    } catch (error) {

        console.error(error);

        showStatus(
            error.message ||
            "Something went wrong. Please try again.",
            "error"
        );

        button.disabled = false;

        button.innerText =
            "Pay KSh 1 with M-PESA";
    }
}


async function checkPaymentStatus(reference) {

    let attempts = 0;

    const maxAttempts = 30;

    const interval =
        setInterval(async () => {

            attempts++;

            try {

                const response =
                    await fetch(
                        BACKEND_URL +
                        "/payment-status/" +
                        encodeURIComponent(reference)
                    );

                const data =
                    await response.json();

                if (
                    data.status === "SUCCESS"
                ) {

                    clearInterval(interval);

                    showStatus(
                        "✅ You have successfully registered!",
                        "success"
                    );

                    const button =
                        document.getElementById(
                            "payButton"
                        );

                    button.innerText =
                        "Registration Successful";

                    button.disabled = true;

                    setTimeout(() => {

                        window.location.href =
                            "countries.html";

                    }, 1500);

                }

                else if (
                    data.status === "FAILED"
                ) {

                    clearInterval(interval);

                    showStatus(
                        "❌ Payment failed. Please try again.",
                        "error"
                    );

                    const button =
                        document.getElementById(
                            "payButton"
                        );

                    button.disabled = false;

                    button.innerText =
                        "Pay KSh 1 with M-PESA";
                }

            } catch (error) {

                console.error(
                    "Status check error:",
                    error
                );

            }

            if (
                attempts >= maxAttempts
            ) {

                clearInterval(interval);

                const button =
                    document.getElementById(
                        "payButton"
                    );

                button.disabled = false;

                button.innerText =
                    "Pay KSh 1 with M-PESA";

                showStatus(
                    "Payment confirmation is taking longer than expected. Please check your M-PESA messages.",
                    "info"
                );
            }

        }, 3000);
}

</script>

</body>
</html>
