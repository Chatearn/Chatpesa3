<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatPesa - Activate Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#090214,#18042e,#26063d);
    color:white;
}

.card{
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

.subtitle{
    color:#ddd;
    line-height:1.6;
    margin-bottom:25px;
}

.price{
    text-align:center;
    padding:20px;
    margin-bottom:25px;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
}

.price p{
    color:#ddd;
    margin-bottom:5px;
}

.price h2{
    font-size:38px;
    color:#ff5ab5;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    margin-bottom:18px;
    outline:none;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:40px;
    background:linear-gradient(90deg,#ff2f92,#ff5ab5);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
}

#status{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    line-height:1.5;
    background:rgba(255,255,255,0.08);
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#bbb;
    font-size:13px;
    line-height:1.8;
}

</style>

</head>

<body>

<div class="card">

    <h1>ChatPesa</h1>

    <p class="subtitle">
        Complete your registration securely.
    </p>

    <div class="price">
        <p>Registration Fee</p>
        <h2>KSh 100</h2>
        <p>One-time registration payment</p>
    </div>

    <label for="phone">
        M-PESA Phone Number
    </label>

    <input
        type="tel"
        id="phone"
        placeholder="0712345678"
        maxlength="13"
    >

    <button id="payButton" onclick="payNow()">
        Continue
    </button>

    <div id="status"></div>

    <div class="footer">
        🔐 Secure payment<br>
        Your payment information is handled securely.
    </div>

</div>


<script>

/*
==================================================
CHATPESA BACKEND URL
DO NOT CHANGE THIS
==================================================
*/

const backend = "https://chatpesa-backend.onrender.com";


async function payNow(){

    const phoneInput = document.getElementById("phone");
    const status = document.getElementById("status");
    const button = document.getElementById("payButton");

    let phone = phoneInput.value.trim();

    if(phone === ""){

        status.style.display = "block";
        status.innerHTML =
            "❌ Please enter your M-PESA phone number.";

        return;
    }


    /*
    Convert 07XXXXXXXX to 2547XXXXXXXX
    */

    if(phone.startsWith("07")){
        phone = "254" + phone.substring(1);
    }

    if(phone.startsWith("+254")){
        phone = phone.substring(1);
    }


    if(!/^2547\d{8}$/.test(phone)){

        status.style.display = "block";
        status.innerHTML =
            "❌ Please enter a valid Kenyan M-PESA number.";

        return;
    }


    status.style.display = "block";

    status.innerHTML =
        "⏳ Connecting to ChatPesa payment server...";

    button.disabled = true;


    try{

        /*
        IMPORTANT:
        ChatPesa uses /stk-push
        */

        const response = await fetch(
            backend + "/stk-push",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    phone:phone,

                    amount:100,

                    reference:
                        "CHATPESA-" + Date.now()

                })
            }
        );


        /*
        Check whether backend actually responded
        */

        if(!response.ok){

            const text = await response.text();

            console.log(
                "Backend error:",
                response.status,
                text
            );

            throw new Error(
                "Server returned " + response.status
            );
        }


        const data = await response.json();

        console.log(
            "ChatPesa response:",
            data
        );


        if(!data.success){

            status.innerHTML =
                "❌ " +
                (data.message ||
                "Unable to send STK Push.");

            button.disabled = false;

            return;
        }


        /*
        STK PUSH SUCCESS
        */

        status.innerHTML =
            "📲 STK Push sent successfully.<br><br>" +
            "Please check your phone and enter your M-PESA PIN.";


        /*
        If backend returns a reference,
        begin checking payment status.
        */

        if(data.reference){

            pollPayment(data.reference);

        }


    }catch(error){

        console.log(
            "ChatPesa connection error:",
            error
        );

        status.innerHTML =
            "❌ Unable to connect to ChatPesa payment server.";

        button.disabled = false;
    }

}


/*
==================================================
PAYMENT STATUS CHECK
==================================================
*/

function pollPayment(reference){

    const status =
        document.getElementById("status");


    const interval = setInterval(async()=>{

        try{

            const response = await fetch(

                backend +
                "/payment-status/" +
                encodeURIComponent(reference)

            );


            if(!response.ok){
                return;
            }


            const result =
                await response.json();


            console.log(
                "Payment status:",
                result
            );


            if(!result.success){
                return;
            }


            const payment =
                result.payment;


            if(!payment){
                return;
            }


            if(payment.status === "completed"){

                clearInterval(interval);

                status.innerHTML =
                    "✅ Payment successful!";

                /*
                Change this later to your
                actual ChatPesa destination.
                */

                setTimeout(()=>{

                    window.location.href =
                        "dashboard.html";

                },2000);

            }


            else if(payment.status === "failed"){

                clearInterval(interval);

                status.innerHTML =
                    "❌ Payment failed.";

                document.getElementById(
                    "payButton"
                ).disabled = false;

            }


            else if(payment.status === "cancelled"){

                clearInterval(interval);

                status.innerHTML =
                    "⚠️ Payment cancelled.";

                document.getElementById(
                    "payButton"
                ).disabled = false;

            }


        }catch(error){

            console.log(
                "Payment status error:",
                error
            );

        }

    },5000);

}

</script>

</body>
</html>
