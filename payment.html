<script>

const backend = "https://chatpesa-backend.onrender.com";

const phoneDisplay = document.getElementById("phoneDisplay");
const status = document.getElementById("status");
const button = document.getElementById("payButton");


function showStatus(message) {

    status.style.display = "block";
    status.innerHTML = message;

}


/* =========================================
   GET REGISTRATION DATA
========================================= */

let registration = null;

try {

    const saved =
        localStorage.getItem("chatpesaRegistration");

    if (saved) {
        registration = JSON.parse(saved);
    }

} catch (error) {

    console.error(
        "Registration data error:",
        error
    );

}


/* =========================================
   CHECK PHONE
========================================= */

function formatPhone(phone) {

    let number =
        String(phone)
            .trim()
            .replace(/\s+/g, "");

    if (number.startsWith("07")) {

        number =
            "254" +
            number.substring(1);

    }

    if (number.startsWith("+254")) {

        number =
            number.substring(1);

    }

    return number;

}


/* =========================================
   LOAD PHONE
========================================= */

if (
    !registration ||
    !registration.phone
) {

    phoneDisplay.innerHTML =
        "No phone number found.";

    button.disabled = true;

    showStatus(
        "❌ Please go back and complete registration first."
    );

} else {

    const phone =
        formatPhone(
            registration.phone
        );

    if (!/^2547\d{8}$/.test(phone)) {

        phoneDisplay.innerHTML =
            "Invalid phone number.";

        button.disabled = true;

        showStatus(
            "❌ Invalid Kenyan M-PESA number."
        );

    } else {

        phoneDisplay.innerHTML =
            phone;

    }

}


/* =========================================
   PAYMENT
========================================= */

async function payNow() {

    console.log(
        "CHATPESA: Continue button pressed"
    );

    if (
        !registration ||
        !registration.phone
    ) {

        showStatus(
            "❌ Please complete registration first."
        );

        return;

    }


    const phone =
        formatPhone(
            registration.phone
        );


    if (!/^2547\d{8}$/.test(phone)) {

        showStatus(
            "❌ Invalid Kenyan M-PESA number."
        );

        return;

    }


    button.disabled = true;

    showStatus(
        "⏳ Connecting to ChatPesa payment server..."
    );


    const reference =
        "CHATPESA-" +
        Date.now();


    const requestData = {

        phone: phone,

        amount: 100,

        reference: reference

    };


    console.log(
        "CHATPESA: Sending request",
        requestData
    );


    try {

        const response =
            await fetch(
                backend + "/stk-push",
                {

                    method: "POST",

                    mode: "cors",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            requestData
                        )

                }
            );


        console.log(
            "CHATPESA: HTTP status",
            response.status
        );


        const text =
            await response.text();


        console.log(
            "CHATPESA: Server response",
            text
        );


        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            data = {
                success: false,
                error: text
            };

        }


        if (!response.ok) {

            showStatus(
                "❌ " +
                (
                    data.error ||
                    data.message ||
                    "Payment request failed."
                )
            );

            button.disabled = false;

            return;

        }


        if (data.success === true) {

            showStatus(
                "📲 STK Push sent successfully.<br><br>" +
                "Check your phone and enter your M-PESA PIN."
            );

            console.log(
                "CHATPESA: STK accepted",
                data
            );

            return;

        }


        showStatus(
            "⚠️ Server responded, but payment could not be confirmed."
        );

        console.log(
            "CHATPESA: Unexpected response",
            data
        );

        button.disabled = false;


    } catch (error) {

        console.error(
            "CHATPESA CONNECTION ERROR:",
            error
        );


        showStatus(
            "❌ Connection error:<br>" +
            error.message
        );


        button.disabled = false;

    }

}

</script>
