<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | ChatPesa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #5b21b6 0%, transparent 35%),
        radial-gradient(circle at bottom right, #7e22ce 0%, transparent 30%),
        #16052b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
}

.payment-container {
    width: 100%;
    max-width: 430px;
    background: rgba(255,255,255,.97);
    color: #222;
    border-radius: 28px;
    padding: 30px 24px;
    box-shadow: 0 25px 70px rgba(0,0,0,.45);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    color: #5b21b6;
}

.logo span {
    color: #9333ea;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin: 7px 0 25px;
}

.payment-box {
    background: linear-gradient(135deg,#f5edff,#faf5ff);
    border: 1px solid #e7d5ff;
    border-radius: 20px;
    padding: 24px 18px;
    text-align: center;
    margin-bottom: 25px;
}

.payment-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg,#6d28d9,#9333ea);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}

.payment-box h2 {
    color: #24113d;
    font-size: 20px;
}

.amount {
    font-size: 42px;
    font-weight: 900;
    color: #6d28d9;
    margin: 7px 0;
}

.payment-box p {
    color: #666;
    font-size: 13px;
    line-height: 1.5;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: #292033;
    margin-bottom: 8px;
}

.input-wrapper {
    position: relative;
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 16px;
}

input {
    width: 100%;
    padding: 15px 15px 15px 45px;
    border: 1px solid #ddd;
    border-radius: 13px;
    font-size: 16px;
    outline: none;
    margin-bottom: 18px;
}

input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 4px rgba(124,58,237,.10);
}

.pay-btn {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#5b21b6,#7c3aed,#9333ea);
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
}

.pay-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.note {
    background: #faf7ff;
    border: 1px solid #eadcff;
    border-radius: 13px;
    padding: 13px;
    margin-top: 18px;
    color: #5b5265;
    font-size: 12px;
    line-height: 1.5;
}

.secure {
    text-align: center;
    margin-top: 20px;
    color: #777;
    font-size: 12px;
}

.footer {
    text-align: center;
    margin-top: 10px;
    color: #aaa;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="payment-container">

    <div class="logo">
        Chat<span>Pesa</span>
    </div>

    <div class="subtitle">
        Complete your registration securely
    </div>

    <div class="payment-box">

        <div class="payment-icon">💳</div>

        <h2>Registration Fee</h2>

        <div class="amount">
            KSh 100
        </div>

        <p>
            One-time registration payment to activate
            your ChatPesa account.
        </p>

    </div>

    <form id="paymentForm">

        <label for="phone">
            M-Pesa Phone Number
        </label>

        <div class="input-wrapper">

            <div class="input-icon">📱</div>

            <input
                type="tel"
                id="phone"
                placeholder="07XXXXXXXX"
                maxlength="10"
                inputmode="numeric"
                required
            >

        </div>

        <button type="submit" class="pay-btn" id="payButton">
            Continue
        </button>

    </form>

    <div class="note">
        🔐 <strong>Secure payment</strong><br>
        Your payment information is handled securely.
    </div>

    <div class="secure">
        🔒 ChatPesa secure payment
    </div>

    <div class="footer">
        © 2026 ChatPesa. All rights reserved.
    </div>

</div>

<script>

const form = document.getElementById("paymentForm");
const phoneInput = document.getElementById("phone");
const payButton = document.getElementById("payButton");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const phone = phoneInput.value.trim();

    if (!/^07\d{8}$/.test(phone)) {
        alert("Please enter a valid Kenyan M-Pesa number, e.g. 0712345678.");
        return;
    }

    /*
      TEST CONNECTION ONLY

      This sends the request to your ChatPesa backend.
      Your Paylor API key remains on the server.
    */

    payButton.disabled = true;
    payButton.textContent = "Connecting...";

    try {

        const response = await fetch(
            "https://chatpesa-backend.onrender.com/stk-push",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone,
                    amount: 1,
                    reference: "CHATPESA-REGISTRATION"
                })
            }
        );

        const data = await response.json();

        console.log("Backend response:", data);

        if (!response.ok) {
            throw new Error(
                data.error || "The payment request could not be processed."
            );
        }

        alert("The request was received successfully.");

    } catch (error) {

        console.error("Connection error:", error);

        alert(
            "Unable to connect to the ChatPesa payment server. Please try again later."
        );

    } finally {

        payButton.disabled = false;
        payButton.textContent = "Continue";

    }

});

</script>

</body>
</html>
