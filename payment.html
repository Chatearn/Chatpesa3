<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | ChatPesa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --purple:#6d28d9;
    --violet:#8b5cf6;
    --dark:#3b0764;
    --deep:#180629;
    --light:#f3eaff;
    --text:#24152f;
    --muted:#7b7085;
    --border:#e4d9ee;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(circle at 10% 10%,rgba(139,92,246,.22),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(109,40,217,.18),transparent 30%),
        linear-gradient(135deg,#f8f4fc,#eee7f7);

    color:var(--text);
}

/* ================= HEADER ================= */

.header{
    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    background:rgba(255,255,255,.86);

    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(109,40,217,.08);
}

.logo{
    font-size:27px;
    font-weight:950;
    letter-spacing:-1.6px;

    background:linear-gradient(
        90deg,
        #4c1d95,
        #7c3aed,
        #a855f7
    );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.back{
    color:#6d28d9;
    text-decoration:none;

    font-size:13px;
    font-weight:850;

    padding:9px 14px;

    border-radius:10px;

    background:#f3eaff;

    transition:.2s;
}

.back:hover{
    background:#eaddff;
    transform:translateY(-1px);
}

/* ================= MAIN ================= */

.main{
    width:100%;
    max-width:540px;

    margin:auto;

    padding:34px 18px 60px;
}

/* ================= PROGRESS ================= */

.progress{
    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:27px;
}

.progress-step{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.circle{
    width:38px;
    height:38px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:900;

    color:white;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #5b21b6
    );

    box-shadow:0 7px 18px rgba(91,33,182,.22);
}

.progress-label{
    margin-top:6px;

    font-size:9px;
    font-weight:800;

    color:#8e8298;
}

.progress-label.active-label{
    color:#6d28d9;
}

.line{
    width:90px;
    height:3px;

    margin:0 8px 19px;

    border-radius:20px;

    background:linear-gradient(
        90deg,
        #8b5cf6,
        #6d28d9
    );
}

/* ================= CARD ================= */

.card{
    background:rgba(255,255,255,.97);

    border-radius:28px;

    padding:31px 27px;

    border:1px solid rgba(255,255,255,.9);

    box-shadow:
        0 30px 80px rgba(45,20,70,.14),
        0 8px 25px rgba(45,20,70,.06);
}

/* ================= TITLE ================= */

.title{
    text-align:center;
}

.title h1{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
}

.title p{
    margin-top:8px;

    color:var(--muted);

    font-size:13px;
    line-height:1.6;
}

/* ================= PRICE ================= */

.price-box{
    position:relative;
    overflow:hidden;

    text-align:center;

    margin:25px 0;

    padding:23px 20px;

    border-radius:19px;

    border:1px solid #ddd0ed;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(139,92,246,.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f4ebff,
            #fbf9ff
        );
}

.price-label{
    color:#7e7388;

    font-size:11px;
    font-weight:750;

    text-transform:uppercase;
    letter-spacing:1px;
}

.price{
