<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose a Country | ChatPesa</title>

<meta
    name="description"
    content="Choose a country on ChatPesa and unlock your connection."
>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #6d28d9;
    --purple-dark: #3b0764;
    --purple-deep: #180629;
    --violet: #8b5cf6;
    --soft: #f2eaff;
    --muted: #756c80;
    --white: #ffffff;
    --text: #21152f;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at top left,
            rgba(139, 92, 246, 0.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #faf9ff 0%,
            #f5efff 45%,
            #eee4ff 100%
        );
    color: var(--text);
}

header {
    width: 100%;
    padding: 18px 20px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(80,35,120,0.08);
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-inner {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    color: var(--purple-dark);
}

.logo span {
    color: var(--violet);
}

.step {
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
}

main {
    width: 100%;
    max-width: 1050px;
    margin: auto;
    padding: 50px 20px 60px;
}

.hero {
    text-align: center;
    max-width: 700px;
    margin: 0 auto 40px;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: 999px;
    background: var(--soft);
    color: var(--purple-dark);
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 16px;
}

.hero h1 {
    font-size: clamp(30px, 7vw, 48px);
    line-height: 1.08;
    margin-bottom: 15px;
    color: var(--purple-deep);
}

.hero h1 span {
    background: linear-gradient(
        90deg,
        #4c1d95,
        #7c3aed,
        #a855f7
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: var(--muted);
    line-height: 1.7;
    font-size: 15px;
}

.country-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.country-card {
    background: rgba(255,255,255,0.96);
    border: 1px solid rgba(109,40,217,0.10);
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 15px 45px rgba(59,7,100,0.08);
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
}

.country-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 55px rgba(59,7,100,0.14);
    border-color: rgba(109,40,217,0.25);
}

.flag {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 18px;
}

.country-card h2 {
    font-size: 20px;
    margin-bottom: 7px;
    color: var(--purple-deep);
}

.description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    min-height: 40px;
}

.price {
    margin: 18px 0;
    font-size: 24px;
    font-weight: 900;
    color: var(--purple);
}

.unlock-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(
        135deg,
        var(--purple-dark),
        var(--purple)
    );
    color: white;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(59,7,100,0.20);
    transition: 0.2s ease;
}

.unlock-btn:hover {
    transform: translateY(-1px);
}

.unlock-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

.status {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.5;
}

.status.info {
    display: block;
    background: #f2eaff;
    color: #4c1d95;
}

.status.success {
    display: block;
    background: #ecfdf5;
    color: #047857;
}

.status.error {
    display: block;
    background: #fef2f2;
    color: #b91c1c;
}

.info-box {
    margin-top: 35px;
    background: rgba(255,255,255,0.90);
    border: 1px solid rgba(109,40,217,0.08);
    border-radius: 22px;
    padding: 22px;
    text-align: center;
}

.info-box strong {
    color: var(--purple-dark);
}

.info-box p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

footer {
    text-align: center;
    padding: 25px 20px 35px;
    color: var(--muted);
    font-size: 12px;
}


/* =========================================
   PROFESSIONAL M-PESA NUMBER MODAL
   ========================================= */

.mpesa-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(24, 6, 41, 0.72);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.mpesa-modal.show {
    display: flex;
}

.mpesa-box {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 28px;
    padding: 28px 24px 24px;
    box-shadow: 0 25px 70px rgba(59, 7, 100, 0.30);
    animation: modalIn 0.25s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.mpesa-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(
        135deg,
        #f2eaff,
        #e9d5ff
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.mpesa-box h3 {
    text-align: center;
    color: var(--purple-deep);
    font-size: 23px;
    margin-bottom: 8px;
}

.mpesa-subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 22px;
}

.mpesa-label {
    display: block;
    color: var(--purple-dark);
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 8px;
}

.mpesa-input-wrap {
    position: relative;
}

.mpesa-input {
    width: 100%;
    height: 54px;
    border: 1.5px solid #ddd3eb;
    border-radius: 15px;
    padding: 0 15px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    background: #faf9ff;
    transition: 0.2s ease;
}

.mpesa-input:focus {
    border-color: var(--purple);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.10);
}

.mpesa-input::placeholder {
    color: #a39aaa;
}

.mpesa-help {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
}

.mpesa-actions {
    display: flex;
    gap: 10px;
    margin-top: 23px;
}

.mpesa-cancel,
.mpesa-continue {
    flex: 1;
    height: 50px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.mpesa-cancel {
    border: 1px solid #ddd3eb;
    background: #ffffff;
    color: var(--purple-dark);
}

.mpesa-continue {
    border: none;
    color: #ffffff;
    background: linear-gradient(
        135deg,
        var(--purple-dark),
        var(--purple)
    );
    box-shadow: 0 9px 20px rgba(59, 7, 100, 0.18);
}

.mpesa-cancel:active,
.mpesa-continue:active {
    transform: scale(0.98);
}
