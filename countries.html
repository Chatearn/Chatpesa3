<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choose Country | ChatPesa</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #180629, #3b0764, #6d28d9);
    color: #21152f;
}

.container {
    width: 100%;
    min-height: 100vh;
    background: #faf9ff;
    padding: 30px 20px 50px;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    color: #3b0764;
    margin-bottom: 12px;
}

.logo span {
    color: #7c3aed;
}

.header h1 {
    font-size: 27px;
    color: #21152f;
    margin-bottom: 10px;
}

.header p {
    color: #756c80;
    font-size: 15px;
    line-height: 1.6;
    max-width: 500px;
    margin: auto;
}

.countries {
    width: 100%;
    max-width: 700px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.country-card {
    background: #ffffff;
    border: 1px solid rgba(80, 35, 120, 0.10);
    border-radius: 20px;
    padding: 24px 18px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(59, 7, 100, 0.07);
}

.flag {
    font-size: 45px;
    margin-bottom: 12px;
}

.country-name {
    font-size: 18px;
    font-weight: 700;
    color: #21152f;
    margin-bottom: 8px;
}

.price {
    color: #6d28d9;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
}

.unlock-btn {
    width: 100%;
    padding: 13px 10px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #3b0764, #7c3aed);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.unlock-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(59, 7, 100, 0.20);
}

.unlock-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.status {
    max-width: 700px;
    margin: 25px auto 0;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    display: none;
    font-size: 14px;
    line-height: 1.5;
}

.status.info {
    display: block;
    background: #f5f3ff;
    color: #5b21b6;
    border: 1px solid #ddd6fe;
}

.status.success {
    display: block;
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
}

.status.error {
    display: block;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}

@media (max-width: 500px) {
    .countries {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 25px 15px 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            Chat<span>Pesa</span>
        </div>

        <h1>
            Choose a Country
        </h1>

        <p>
            Select the country you want to unlock.
            A small M-PESA payment is required before chatting.
        </p>

    </div>


    <div class="countries">

        <!-- CHINA -->

        <div class="country-card">

            <div class="flag">🇨🇳</div>

            <div class="country-name">
                China
            </div>

            <div class="price">
                KSh 2
            </div>

            <button
                class="unlock-btn"
                onclick="unlockCountry('China', 2, this)">
                Unlock China
            </button>

        </div>


        <!-- CANADA -->

        <div class="country-card">

            <div class="flag">🇨🇦</div>

            <div class="country-name">
                Canada
            </div>

            <div class="price">
                KSh 3
            </div>

            <button
                class="unlock-btn"
                onclick="unlockCountry('Canada', 3, this)">
                Unlock Canada
            </button>

        </div>


        <!-- AUSTRALIA -->

        <div class="country-card">

            <div class="flag">🇦🇺</div>

            <div class="country-name">
                Australia
            </div>

            <div class="price">
                KSh 4
            </div>

            <button
                class="unlock-btn"
                onclick="unlockCountry('Australia', 4, this)">
                Unlock Australia
            </button>

        </div>


        <!-- UK -->

        <div class="country-card">

            <div class="flag">🇬🇧</div>

            <div class="country-name">
                United Kingdom
            </div>

            <div class="price">
                KSh 5
            </div>

            <button
                class="unlock-btn"
                onclick="unlockCountry('UK', 5, this)">
                Unlock UK
            </button>

        </div>


        <!-- USA -->

        <div class="country-card">

            <div class="flag">🇺🇸</div>

            <div class="country-name">
                USA
            </div>

            <div class="price">
                KSh 6
            </div>

            <button
                class="unlock-btn"
                onclick="unlockCountry('USA', 6, this)">
                Unlock USA
            </button>

        </div>


        <!-- OTHERS -->

        <div class="country-card">

            <div class="flag">🌍</div>

            <div class="country-name">
                Others
            </div>

            <div class="price">
                KSh 1
            </div>

            <button
                class="unlock-btn"
                onclick="unlockCountry('Others', 1, this)">
                Unlock Others
            </button>

        </div>

    </div>


    <div id="status" class="status"></div>

</div>


<script>

const BACKEND_URL =
    "https://chatpesa-backend.onrender.com";


function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.innerText = message;

    status.className =
        "status " + type;
}


async function unlockCountry(
    country,
    amount,
    button
) {

    const phone = prompt(
        "Enter your M-PESA phone number:"
    );


    if (!phone) {
        return;
    }


    const cleanPhone =
        phone.replace(/\s+/g, "");


    if (
        !/^2547\d{8}$/.test(cleanPhone)
    ) {

        showStatus(
            "Please enter a valid M-PESA number in the format 2547XXXXXXXX.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "Sending STK Push...";


    showStatus(
        "Sending KSh " +
        amount +
        " M-PESA payment request for " +
        country +
        ".",
        "info"
    );


    const reference =
        "CP-" +
        country.toUpperCase() +
        "-" +
        Date.now();


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/stk-push",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        phone: cleanPhone,

                        amount: amount,

                        reference: reference,

                        type: "country_unlock",

                        country: country

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "STK Push request failed."
            );

        }


        showStatus(
            "📱 STK Push sent. Check your phone and enter your M-PESA PIN to unlock " +
            country +
            ".",
            "info"
        );


        button.innerText =
            "Waiting for Payment...";


        checkPaymentStatus(
            reference,
            country,
            button
        );


    } catch (error) {

        console.error(error);


        showStatus(
            error.message ||
            "Unable to send payment request.",
            "error"
        );


        button.disabled = false;

        button.innerText =
            "Unlock " + country;
    }
}


function checkPaymentStatus(
    reference,
    country,
    button
) {

    let attempts = 0;

    const maxAttempts = 30;


    const interval =
        setInterval(async () => {

            attempts++;


            try {

                const response =
                    await fetch(
                        BACKEND_URL +
                        "/payment-status/" +
                        encodeURIComponent(
                            reference
                        )
                    );


                const data =
                    await response.json();


                if (
                    data.status ===
                    "SUCCESS"
                ) {

                    clearInterval(interval);


                    showStatus(
                        "✅ Payment successful! " +
                        country +
                        " has been unlocked.",
                        "success"
                    );


                    button.innerText =
                        "✓ " +
                        country +
                        " Unlocked";


                    button.disabled = true;


                    setTimeout(() => {

                        window.location.href =
                            "chat.html?country=" +
                            encodeURIComponent(
                                country
                            );

                    }, 1500);

                }


                else if (
                    data.status ===
                    "FAILED"
                ) {

                    clearInterval(interval);


                    showStatus(
                        "❌ Payment failed. Please try again.",
                        "error"
                    );


                    button.disabled = false;

                    button.innerText =
                        "Unlock " + country;
                }


            } catch (error) {

                console.error(
                    "Payment status error:",
                    error
                );

            }


            if (
                attempts >= maxAttempts
            ) {

                clearInterval(interval);


                button.disabled = false;

                button.innerText =
                    "Unlock " + country;


                showStatus(
                    "Payment confirmation is taking longer than expected. Please check your M-PESA messages.",
                    "info"
                );

            }

        }, 3000);
}

</script>

</body>
</html>
