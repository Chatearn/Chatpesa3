<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatPesa — Connect. Chat. Earn.</title>

<meta name="description"
content="ChatPesa connects people across borders through conversations and opportunities.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#faf9ff;
    color:#21152f;
    overflow-x:hidden;
}

:root{
    --purple:#6d28d9;
    --purple-dark:#3b0764;
    --purple-deep:#180629;
    --violet:#8b5cf6;
    --soft:#f2eaff;
    --muted:#756c80;
    --white:#ffffff;
}


/* ================= GLOBAL ================= */

.container{
    width:min(1160px,92%);
    margin:auto;
}

a{
    -webkit-tap-highlight-color:transparent;
}

button,
a{
    transition:.25s ease;
}


/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;

    background:rgba(255,255,255,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(80,35,120,.08);
}

.nav{
    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:28px;
    font-weight:950;
    letter-spacing:-1.8px;
    color:var(--purple);
}

.logo span{
    color:#20142b;
}

.nav-link{
    text-decoration:none;
    color:#fff;

    padding:11px 20px;

    border-radius:12px;

    font-size:14px;
    font-weight:850;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #5b21b6
    );

    box-shadow:
        0 8px 25px rgba(91,33,182,.25);
}

.nav-link:hover{
    transform:translateY(-2px);
}


/* ================= HERO ================= */

.hero{
    min-height:850px;
    padding:155px 0 130px;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(139,92,246,.20),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 12%,
            rgba(109,40,217,.17),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f8f4ff,
            #fff 60%
        );
}

.hero::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(124,58,237,.09);

    filter:blur(70px);

    top:300px;
    left:-180px;
}

.hero::after{
    content:"";

    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    background:rgba(168,85,247,.10);

    filter:blur(70px);

    right:-130px;
    bottom:80px;
}

.hero-content{
    position:relative;
    z-index:2;

    text-align:center;
}

.eyebrow{
    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:9px 15px;

    border-radius:50px;

    background:rgba(255,255,255,.75);

    border:1px solid rgba(109,40,217,.15);

    color:var(--purple);

    font-size:12px;

    font-weight:850;

    letter-spacing:.3px;

    box-shadow:
        0 8px 25px rgba(50,20,80,.06);
}

.live-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#8b5cf6;

    box-shadow:
        0 0 0 5px rgba(139,92,246,.12);
}

.hero h1{
    max-width:940px;

    margin:25px auto 0;

    font-size:clamp(52px,8.5vw,88px);

    line-height:.94;

    letter-spacing:-5px;

    font-weight:950;

    color:#21152f;
}

.hero h1 .gradient{
    background:
        linear-gradient(
            90deg,
            #4c1d95,
            #7c3aed,
            #a855f7
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.hero-description{
    max-width:680px;

    margin:28px auto 0;

    color:var(--muted);

    font-size:18px;

    line-height:1.7;
}


/* ================= WAZUNGU OPPORTUNITY BANNER ================= */

.opportunity-banner{
    max-width:850px;

    margin:25px auto 0;

    padding:18px 24px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #3b0764,
            #7c3aed
        );

    color:#fff;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 15px 35px rgba(91,33,182,.25);

    text-align:center;
}

.opportunity-banner strong{
    display:block;

    font-size:clamp(18px,3vw,27px);

    font-weight:950;

    letter-spacing:.3px;
}

.opportunity-banner span{
    display:block;

    margin-top:7px;

    color:#f1e8ff;

    font-size:clamp(11px,2vw,15px);

    font-weight:800;

    letter-spacing:.5px;

    line-height:1.6;
}


.hero-actions{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:14px;

    margin-top:34px;

    flex-wrap:wrap;
}


/* ================= BUTTONS ================= */

.btn{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    min-height:54px;

    padding:15px 24px;

    border-radius:15px;

    text-decoration:none;

    font-size:15px;

    font-weight:850;
}

.btn-primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #5b21b6
        );

    box-shadow:
        0 14px 35px rgba(91,33,182,.28);

    padding:17px 29px;

    min-height:58px;

    font-size:16px;
}

.btn-primary:hover{
    transform:translateY(-3px);

    box-shadow:
        0 18px 42px rgba(91,33,182,.35);
}

.btn-secondary{
    color:#5b21b6;

    background:rgba(255,255,255,.8);

    border:1px solid #dfd0ef;
}

.btn-secondary:hover{
    transform:translateY(-3px);
}


/* ================= HERO PREVIEW ================= */

.preview-wrap{
    max-width:980px;

    margin:70px auto 0;

    position:relative;

    z-index:3;
}

.preview{
    padding:10px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.9),
            rgba(238,226,255,.75)
        );

    border:1px solid rgba(109,40,217,.15);

    box-shadow:
        0 35px 90px rgba(45,15,75,.16),
        0 10px 30px rgba(45,15,75,.06);
}

.preview-window{
    border-radius:23px;

    overflow:hidden;

    background:#fff;

    border:1px solid #eee7f4;
}

.window-top{
    height:48px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:0 17px;

    background:#faf8fc;

    border-bottom:1px solid #eee8f3;
}

.window-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#d5cadf;
}

.window-title{
    margin-left:9px;

    font-size:11px;

    color:#91869b;
}

.preview-content{
    padding:24px;

    display:grid;

    grid-template-columns:
        1.5fr .8fr .8fr;

    gap:15px;
}

.preview-card{
    min-height:155px;

    padding:24px;

    border-radius:20px;

    background:#faf9fc;

    border:1px solid #eee8f3;
}

.preview-card.primary{
    color:white;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(255,255,255,.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #4c1d95,
            #7c3aed
        );
}

.preview-card small{
    display:block;

    font-size:10px;

    letter-spacing:1.4px;

    font-weight:800;

    opacity:.75;
}

.preview-card strong{
    display:block;

    margin-top:12px;

    font-size:25px;
}

.preview-card p{
    margin-top:6px;

    color:#83798d;

    font-size:12px;
}

.preview-card.primary p{
    color:#eadfff;
}


/* ================= TRUST ================= */

.trust{
    position:relative;

    z-index:5;

    margin-top:-40px;
}

.trust-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}

.trust-card{
    display:flex;

    align-items:center;

    gap:13px;

    padding:17px 20px;

    border-radius:17px;

    background:rgba(255,255,255,.94);

    border:1px solid #ebe3f2;

    box-shadow:
        0 15px 35px rgba(35,15,55,.07);
}

.trust-icon{
    width:42px;
    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:#f0e7ff;

    font-size:19px;
}

.trust-card strong{
    display:block;

    font-size:13px;
}

.trust-card span{
    color:#8a8092;

    font-size:11px;
}


/* ================= SECTIONS ================= */

.section{
    padding:105px 0;
}

.section-heading{
    max-width:700px;

    text-align:center;

    margin:0 auto 48px;
}

.section-label{
    color:var(--purple);

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:2px;
}

.section-heading h2{
    margin-top:11px;

    font-size:clamp(36px,6vw,55px);

    line-height:1.02;

    letter-spacing:-2.5px;
}

.section-heading p{
    margin-top:15px;

    color:var(--muted);

    font-size:16px;
}


/* ================= FEATURES ================= */

.feature-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}

.feature{
    position:relative;

    padding:32px;

    background:#fff;

    border:1px solid #ece
